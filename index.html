<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Web Đầu Tiên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding-top: 50px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Chào bạn! 👋</h1>
        <p>Đây là trang web chạy bằng <b>PyCharm</b>.</p>
        <p id="message">Lập trình không hề chán đúng không?</p>
        <button onclick="changeText()">Bấm thử vào đây!</button>
    </div>

    <script>
        function changeText() {
            document.getElementById("message").innerHTML = "Chúc bạn học Python và HTML vui vẻ! 🎉";
            document.getElementById("message").style.color = "red";
        }
    </script>

</body>
</html>
